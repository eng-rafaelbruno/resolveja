<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Serviços - ResolveJá</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <!-- Menu Lateral (Sidebar) -->
    <aside class="dashboard-sidebar">
        <div class="sidebar-brand">
            ResolveJá
        </div>
        <nav class="sidebar-nav">
            <a href="painel.html" class="nav-item">Visão Geral</a>
            <a href="servicos.html" class="nav-item active">Meus Serviços</a>
            <a href="perfil.html" class="nav-item">Meu Perfil</a>
            <a href="configuracoes.html" class="nav-item">Configurações</a>
        </nav>
        <div class="sidebar-footer">
            <button id="btnLogout" class="btn-logout">Sair</button>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="dashboard-main">
        <header class="dashboard-header">
            <div class="header-welcome">
                <h1 id="pageTitle">Meus Serviços</h1>
                <p id="pageSubtitle">Gerencie todos os seus serviços solicitados e histórico.</p>
            </div>
            <div class="header-profile">
                <div class="profile-avatar" id="userAvatar">U</div>
            </div>
        </header>

        <section class="dashboard-content">
            <div class="content-card">
                <div class="card-header">
                    <h2 id="cardTitle">Todos os Serviços</h2>
                    <button class="btn-action" id="btnNovoServico">+ Novo Serviço</button>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Serviço</th>
                                <th>Categoria</th>
                                <th>Data</th>
                                <th>Status</th>
                                <th id="thAcoes" style="display: none;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaServicosBody">
                            <tr id="linhaVazia">
                                <td colspan="4" style="text-align: center; color: #94a3b8; padding: 28px 0;">
                                    Nenhum serviço encontrado ainda.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal: Novo Serviço -->
    <div class="modal-overlay-dark" id="modalNovoServico">
        <div class="modal-card-dark">
            <div class="modal-card-dark-header">
                <h2>Novo Serviço</h2>
                <button type="button" class="modal-close-dark" id="btnFecharModalServico">&times;</button>
            </div>
            <form id="formNovoServico">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 8px; color: #fff;">Nome do Serviço</label>
                    <input type="text" id="inputServicoNome" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff;" placeholder="Ex: Troca de Torneira" />
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 8px; color: #fff;">Categoria</label>
                    <select id="inputServicoCategoria" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff;">
                        <option value="Elétrica">Elétrica</option>
                        <option value="Hidráulica">Hidráulica</option>
                        <option value="Climatização">Climatização</option>
                        <option value="Pintura">Pintura</option>
                        <option value="Limpeza">Limpeza</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                <div style="margin-bottom: 24px;">
                    <label style="display: block; margin-bottom: 8px; color: #fff;">Descrição (opcional)</label>
                    <textarea id="inputServicoDescricao" rows="3" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #fff; resize: vertical;" placeholder="Detalhe o que você precisa..."></textarea>
                </div>
                <button type="submit" class="btn-action" style="width: 100%;">Solicitar Serviço</button>
            </form>
        </div>
    </div>

    <!-- Script de sessão -->
    <script>
        const usuarioLogado = localStorage.getItem('usuarioNome') || 'Cliente/Profissional';
        document.getElementById('userAvatar').innerText = usuarioLogado.charAt(0).toUpperCase();

        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('usuarioNome');
            window.location.href = 'login.html';
        });

        // Detecta se o usuário logado é CLIENTE ou PRESTADOR (mesma lógica do painel.html)
        let ehPrestador = false;

        try {
            const usuarioSalvo = JSON.parse(localStorage.getItem('usuarioResolveJa') || 'null');
            if (usuarioSalvo && usuarioSalvo.tipo === 'PRESTADOR') {
                ehPrestador = true;
            }
        } catch (erro) {
            // segue para o fallback abaixo
        }

        if (!ehPrestador && usuarioLogado.toLowerCase().includes('profissional')) {
            ehPrestador = true;
        }

        // Ajusta os textos da tela para o profissional (mesma estrutura, texto diferente)
        if (ehPrestador) {
            document.getElementById('pageTitle').innerText = 'Solicitações Recebidas';
            document.getElementById('pageSubtitle').innerText = 'Acompanhe os chamados que os clientes enviaram para você.';
            document.getElementById('cardTitle').innerText = 'Todas as Solicitações Recebidas';

            const btnNovoServicoEl = document.getElementById('btnNovoServico');
            if (btnNovoServicoEl) {
                btnNovoServicoEl.style.display = 'none';
            }

            const thAcoesEl = document.getElementById('thAcoes');
            if (thAcoesEl) {
                thAcoesEl.style.display = '';
            }
        }

        // ================================================================
        // ARMAZENAMENTO COMPARTILHADO DE SERVIÇOS
        // Como ainda não existe backend real, os serviços solicitados pelo
        // cliente ficam salvos aqui, e essa MESMA lista é lida pelo profissional.
        // ================================================================
        const CHAVE_SERVICOS = 'servicosResolveJa';

        function carregarTodosServicos() {
            try {
                return JSON.parse(localStorage.getItem(CHAVE_SERVICOS)) || [];
            } catch (erro) {
                return [];
            }
        }

        function salvarTodosServicos(lista) {
            localStorage.setItem(CHAVE_SERVICOS, JSON.stringify(lista));
        }

        function badgeStatus(status) {
            if (status === 'Concluído') {
                return '<span class="badge badge-success">Concluído</span>';
            }
            if (status === 'Pendente') {
                return '<span class="badge badge-pending">Pendente</span>';
            }
            return '<span class="badge badge-warning">Em andamento</span>';
        }

        // Ações do profissional sobre um chamado
        function aceitarServico(id) {
            const todos = carregarTodosServicos();
            const atualizados = todos.map(s => s.id === id ? { ...s, status: 'Em andamento', profissional: usuarioLogado } : s);
            salvarTodosServicos(atualizados);
            renderizarTabela();
        }

        function concluirServico(id) {
            const todos = carregarTodosServicos();
            const atualizados = todos.map(s => s.id === id ? { ...s, status: 'Concluído' } : s);
            salvarTodosServicos(atualizados);
            renderizarTabela();
        }

        function acoesServico(servico) {
            if (!ehPrestador) return '';
            if (servico.status === 'Pendente') {
                return `<td><button type="button" class="btn-mini btn-mini-accept" onclick="aceitarServico(${servico.id})">Aceitar</button></td>`;
            }
            if (servico.status === 'Em andamento') {
                return `<td><button type="button" class="btn-mini btn-mini-complete" onclick="concluirServico(${servico.id})">Concluir</button></td>`;
            }
            return '<td style="color: #94a3b8;">—</td>';
        }

        // Cliente só vê os serviços que ele mesmo pediu; profissional vê todos
        function obterServicosVisiveis() {
            const todos = carregarTodosServicos();
            return ehPrestador ? todos : todos.filter(s => s.cliente === usuarioLogado);
        }

        function renderizarTabela() {
            const lista = obterServicosVisiveis();
            const tbody = document.getElementById('tabelaServicosBody');

            if (lista.length === 0) {
                const mensagem = ehPrestador
                    ? 'Nenhuma solicitação recebida ainda.'
                    : 'Nenhum serviço encontrado ainda.';
                const colspan = ehPrestador ? 5 : 4;
                tbody.innerHTML = `<tr id="linhaVazia"><td colspan="${colspan}" style="text-align: center; color: #94a3b8; padding: 28px 0;">${mensagem}</td></tr>`;
                return;
            }

            tbody.innerHTML = lista
                .slice()
                .reverse()
                .map(servico => `
                    <tr>
                        <td>${servico.nome}</td>
                        <td>${servico.categoria}</td>
                        <td>${servico.data}</td>
                        <td>${badgeStatus(servico.status)}</td>
                        ${acoesServico(servico)}
                    </tr>
                `)
                .join('');
        }

        // Primeira renderização, com os dados que já existirem salvos
        renderizarTabela();

        // Modal: Novo Serviço
        const btnNovoServico = document.getElementById('btnNovoServico');
        const modalNovoServico = document.getElementById('modalNovoServico');
        const btnFecharModalServico = document.getElementById('btnFecharModalServico');
        const formNovoServico = document.getElementById('formNovoServico');

        if (btnNovoServico) {
            btnNovoServico.addEventListener('click', () => {
                modalNovoServico.classList.add('active');
            });
        }

        btnFecharModalServico.addEventListener('click', () => {
            modalNovoServico.classList.remove('active');
        });

        modalNovoServico.addEventListener('click', (e) => {
            if (e.target === modalNovoServico) {
                modalNovoServico.classList.remove('active');
            }
        });

        formNovoServico.addEventListener('submit', (e) => {
            e.preventDefault();

            const nome = document.getElementById('inputServicoNome').value.trim();
            const categoria = document.getElementById('inputServicoCategoria').value;
            const descricao = document.getElementById('inputServicoDescricao').value.trim();
            if (!nome) return;

            const todos = carregarTodosServicos();
            todos.push({
                id: Date.now(),
                nome,
                categoria,
                descricao,
                data: new Date().toLocaleDateString('pt-BR'),
                status: 'Pendente',
                cliente: usuarioLogado
            });
            salvarTodosServicos(todos);

            renderizarTabela();

            formNovoServico.reset();
            modalNovoServico.classList.remove('active');
            alert('Serviço solicitado com sucesso!');
        });
    </script>
</body>
</html>
