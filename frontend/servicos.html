<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Serviços - ResolveJá</title>
    <link rel="stylesheet" href="style.css?v=20261016">
    <script>/* preferências salvas: tema escuro + aviso de tradução ausente */(function(){try{var c=JSON.parse(localStorage.getItem('configuracoesResolveJa'))||{};if(c.modoEscuro)document.documentElement.classList.add('tema-escuro');if(c.idioma&&c.idioma!=='pt-BR')document.addEventListener('DOMContentLoaded',function(){if(!window.I18N){var b=document.createElement('div');b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#b91c1c;color:#fff;padding:10px 16px;font:14px sans-serif;text-align:center';b.textContent='Tradução indisponível: o arquivo i18n.js não foi encontrado na pasta frontend. / Translation unavailable: i18n.js was not found in the frontend folder.';document.body.appendChild(b);}});}catch(e){}})();</script>
</head>
<body class="dashboard-body">

    <!-- Menu Lateral (Sidebar) -->
    <aside class="dashboard-sidebar">
        <div class="sidebar-brand">
            ResolveJá
        </div>
        <nav class="sidebar-nav">
            <a href="painel.html" class="nav-item">Visão Geral</a>
            <a href="servicos.html" class="nav-item active">Meus Serviços</a>
            <a href="pagamentos.html" class="nav-item">Pagamentos</a>
            <a href="perfil.html" class="nav-item">Meu Perfil</a>
            <a href="configuracoes.html" class="nav-item">Configurações</a>
        </nav>
        <div class="sidebar-footer">
            <button id="btnLogout" class="btn-logout">Sair</button>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="dashboard-main">
        <header class="dashboard-header">
            <div class="header-welcome">
                <h1 id="pageTitle">Meus Serviços</h1>
                <p id="pageSubtitle">Gerencie todos os seus serviços solicitados e histórico.</p>
            </div>
            <div class="header-profile">
                <div class="profile-avatar" id="userAvatar">U</div>
            </div>
        </header>

        <section class="dashboard-content">
            <div class="content-card">
                <div class="card-header">
                    <h2 id="cardTitle">Todos os Serviços</h2>
                    <button class="btn-action" id="btnNovoServico">+ Novo Serviço</button>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Serviço</th>
                                <th>Categoria</th>
                                <th>Data</th>
                                <th>Status</th>
                                <th id="thAcoes">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaServicosBody">
                            <tr id="linhaVazia">
                                <td colspan="5" style="text-align: center; color: #94a3b8; padding: 28px 0;">
                                    Nenhum serviço encontrado ainda.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="resolveja-comum.js?v=20261016"></script>
    <script>
        RJ.iniciarSessao();

        if (RJ.ehPrestador()) {
            document.getElementById('pageTitle').innerText = 'Solicitações Recebidas';
            document.getElementById('pageSubtitle').innerText = 'Acompanhe os chamados que os clientes enviaram para você.';
            document.getElementById('cardTitle').innerText = 'Todas as Solicitações Recebidas';
        }

        RJ.iniciarServicos();
    </script>
</body>
</html>
