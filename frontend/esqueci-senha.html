<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResolveJá - Recuperar Senha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-auth">

    <div class="auth-container">
        <div class="auth-box">
            <a href="index.html" class="logo" style="display: block; text-align: center; margin-bottom: 20px;">Resolve<span>Já</span></a>
            <h2>Redefinir Senha</h2>
            <p style="text-align: center; margin-bottom: 20px;">Informe seu e-mail e defina uma nova senha.</p>

            <form id="formEsqueci">
                <div class="input-group">
                    <label for="esqueciEmail">E-mail</label>
                    <input type="email" id="esqueciEmail" placeholder="seu@email.com" required>
                    <small id="erro-esqueciEmail" class="error-msg"></small>
                </div>

                <div class="input-group">
                    <label for="novaSenha">Nova Senha</label>
                    <input type="password" id="novaSenha" placeholder="Digite a nova senha" required>
                    <small id="erro-novaSenha" class="error-msg"></small>
                </div>

                <div class="input-group">
                    <label for="confirmaSenha">Confirmar Nova Senha</label>
                    <input type="password" id="confirmaSenha" placeholder="Confirme a nova senha" required>
                    <small id="erro-confirmaSenha" class="error-msg"></small>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Alterar Senha</button>
            </form>

            <div style="text-align: center; margin-top: 15px; font-size: 14px;">
                <p><a href="login.html" style="color: #94a3b8; text-decoration: none;">Voltar para o login</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
